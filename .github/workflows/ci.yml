name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          pip install . pytest ruff mypy build
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src/sklab
      - name: Tests
        run: python -m pytest
      - name: Build package
        run: python -m build
      - name: Verify installed CLI
        run: |
          pip install dist/*.whl --force-reinstall
          sklab --version
